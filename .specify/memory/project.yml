# Project parameters — the single declaration of everything project-specific.
#
# AUTHORITY. Tier 1 under the constitution's "Markdown Control Surface": this file
# INSTANTIATES values the constitution's rules refer to. It originates no rule. Where a
# rule and a value disagree, the constitution controls and this file is the defect.
#
# THE ONE-PLACE RULE. A value declared here MUST NOT be restated anywhere else. Documents
# and tools REFERENCE it (constitution, Governance, "Project Parameters Live In One
# Declaration").
#
# NO ABSOLUTE PATHS. Every path below is relative to the repository root, which is resolved
# at run time (.specify/scripts/python/project_params.py) and never stored.
#
# FORMAT CONTRACT. A SMALL YAML subset: comments, nested mappings by two-space indent,
# block sequences of scalars, single-line scalars, inline comments. No folded or literal
# block scalars, anchors, aliases, flow collections or multiple documents.

schema: 1

identity:
  name: optSolver
  slug: optsolver
  repository_name: optSolver
  description: "Rust library for solving large matrix-form optimisation problems through native solver interfaces, with zero-copy CSC inputs."

structure:
  # One crate, optsolver, at the repository root (specified, not yet created).
  source: src
  tests: tests
  benches: benches
  specs: specs
  docs: docs
  architecture: docs/architecture
  literature: literature
  literature_sources_index: literature/SOURCES.md
  # Generated output has one home (constitution IX-C, IX-E).
  generated: results
  scratch: tmp
  retired: old
  governance: .specify/memory

branches:
  # Constitution, "Feature Branches Begin And End At The Integration Branch".
  integration: devel
  # Files above this size are rejected by GitHub outright.
  max_file_bytes_remote: 104857600

registers:
  constitution: .specify/memory/constitution.md
  changelog: .specify/memory/changelog.md
  architecture_model: docs/architecture/repo_folder_organisation.md
  architecture_components: docs/architecture/components.yaml
  architecture_boundaries: docs/architecture/boundaries.yaml
  decisions: docs/architecture/decisions
  human_loop_workflow: .specify/extensions/human-loop/workflow.md

domain:
  primary_language: rust
  # Supported solver versions (constitution VII-E, X). Bindings are checked against these.
  solvers:
    gurobi: "13.0.3"
    mosek: "11.2"

# Frozen test corpus (constitution II). Fixtures are extracted from the variational
# kinetics repository's frozen problem corpus (its data/interim directory, located at run
# time, never stored here) with provenance records; docs/test-corpus.md describes each.
test_corpus:
  fixtures: tests/fixtures
  source_repository: variationalKinetics
  # LP: MPS files in `fixtures`, objective regenerated from seeds.
  lp_format: mps
  objective: seeded-random
  lp_instances:
    - iDopaNeuroC_problem_LP
  # LP fixture name -> variational kinetics source instance.
  lp_source_instances:
    iDopaNeuroC_problem_LP: iDopaNeuroC_problem_1
  # QP: derived from an LP fixture (provenance only, in `fixtures`/qp).
  qp_instances:
    - iDopaNeuroC_problem_LP_minNorm
  # CLP: the problem optimizeVKmodel passes to solveCobraCLP, MOSEK JTASK in `fixtures`/clp.
  clp_format: jtask
  clp_instances:
    - iCoreED_problem_1
    - iCoreED_problem_2
    - iCoreED_problem_3
    - iCoreED_problem_4
    - iCoreED_problem_5
  # Heavy tier (OPTSOLVER_HEAVY_TESTS=1); iDopaNeuroC_problem_4 excluded (MOSEK stalls).
  clp_heavy_instances:
    - iDopaNeuroC_problem_1
    - iDopaNeuroC_problem_2
    - iDopaNeuroC_problem_2_fullRankFR
    - iDopaNeuroC_problem_3
    - iDopaNeuroC_problem_3_fullRankFR
    - iDopaNeuroC_problem_5
  # Instances whose solver-reported optimum is expected to FAIL independent verification
  # (maintainer decision at feature 002 Gate 3, 2026-11-15; research R19): MOSEK reports
  # Optimal with a row-bound violation of about 2e-7 relative, as the variational kinetics
  # reference run does. The test asserts that the verifier catches it.
  clp_expected_verification_failures:
    - iDopaNeuroC_problem_5

# Machine-specific values are DELIBERATELY ABSENT: resolved at run time and recorded in each
# run's provenance, never configured here.
environment:
  policy: resolved-at-runtime-and-recorded-in-provenance
  resolved_not_stored:
    - repository_root
    - gurobi_installation
    - mosek_installation
    - licence_location
