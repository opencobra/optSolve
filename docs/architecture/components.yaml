# Component model (constitution XIII-A, XIII-B). Tier 1; originates no rule.
# Reconciled at feature 001 closeout against specs/001-core-gurobi-lp/architecture-delta.yaml
# (ADR-0001), and in feature 002 (task T038) against specs/002-mosek-lp-qp-clp/
# architecture-delta.yaml (ADR-0002), and in feature 003 (task T023) against
# specs/003-llm-interface-toy-instances/architecture-delta.yaml (ADR-0003). Boundaries:
# boundaries.yaml.
schema: 1
components:
  - id: core.problem
    location: src/problem.rs, src/problem/validate.rs, src/problem/convert.rs
    responsibility: solver-independent problem (LP, QP with lower-triangle Q, conic data), single-pass validation, usize-to-i32 block conversion
  - id: core.conic
    location: src/conic.rs
    responsibility: cone types and kinds (ConeKind), validated conic data (F, g, cones), cone and dual-cone membership measures
  - id: core.options
    location: src/options.rs, src/options/check.rs
    responsibility: options structure, the single declaration of optSolver defaults (VII-G), option, problem-class and cone-kind checks
  - id: core.result
    location: src/result.rs
    responsibility: solution (incl. split bound multipliers z_l, z_u and conic duals s), status vocabulary, limit reasons, basis, certificates
  - id: core.verify
    location: src/verify.rs
    responsibility: solver-independent verification (XVI-D), LP, QP and conic measures
  - id: core.backend
    location: src/backend.rs
    responsibility: Backend trait (ADR-0001, re-examined with its second implementation in ADR-0002), ProblemRef, ProblemClass, Capabilities (incl. accepted cone kinds, ADR-0003)
  - id: core.error
    location: src/error.rs
    responsibility: error type
  - id: gurobi.ffi
    location: src/gurobi/ffi.rs
    responsibility: the only Gurobi C declarations and constants
  - id: gurobi.env
    location: src/gurobi/env.rs
    responsibility: owned Gurobi environment
  - id: gurobi.load
    location: src/gurobi/load.rs
    responsibility: bulk loading, ranged-row auxiliary columns, infinity mapping
  - id: gurobi.load_qc
    location: src/gurobi/load_qc.rs
    responsibility: quadratic objective and second-order cones (auxiliary columns, quadratic constraints, F through a fixed buffer)
  - id: gurobi.params
    location: src/gurobi/params.rs
    responsibility: the single function applying Gurobi parameters (VII-G)
  - id: gurobi.status
    location: src/gurobi/status.rs
    responsibility: total status translation
  - id: gurobi.callback
    location: src/gurobi/callback.rs
    responsibility: cancellation and progress callback with panic containment
  - id: gurobi.solve
    location: src/gurobi/solve.rs
    responsibility: Backend for Env (LP, QP, second-order cones), result extraction incl. conic duals, load report for benchmarks
  - id: mosek.ffi
    location: src/mosek/ffi.rs
    responsibility: the only MOSEK C declarations and constants (header-checked)
  - id: mosek.env
    location: src/mosek/env.rs
    responsibility: owned MOSEK environment (licence checked out at creation), per-solve task
  - id: mosek.load
    location: src/mosek/load.rs
    responsibility: bulk loading of LP, QP and conic data into a task
  - id: mosek.params
    location: src/mosek/params.rs
    responsibility: the single function applying MOSEK parameters (VII-G)
  - id: mosek.status
    location: src/mosek/status.rs
    responsibility: total translation of MOSEK termination, problem and solution statuses
  - id: mosek.callback
    location: src/mosek/callback.rs
    responsibility: progress, cancellation and panic containment
  - id: mosek.solve
    location: src/mosek/solve.rs
    responsibility: Backend for MOSEK, solution and certificate extraction, load report
  - id: mosek.probes
    location: src/mosek/probes.rs
    responsibility: licensed probes of MOSEK behaviour the backend relies on (test only)
  - id: test.harness
    location: tests/common/
    responsibility: the shared test module (harness with heavy tier and backend pairs, MPS and JTASK readers, seeded objectives, fixtures, toy trials, cross-solver comparison with report, contract-level per-backend tests)
  - id: test.corpus
    location: tests/fixtures/
    responsibility: frozen LP fixture iDopaNeuroC_problem_LP, derived QP record, variational kinetics CLP fixtures (JTASK), and small toy instances for every class and cone kind (MPS, JTASK), with provenance
  - id: tools.corpus_extraction
    location: tools/corpus/extract_idopaneuroc_fixtures.m
    responsibility: MATLAB extraction from the variational kinetics corpus
  - id: tools.vk_clp_extraction
    location: tools/corpus/extract_vk_clp_fixtures.m
    responsibility: capture of the variational kinetics conic problems as JTASK fixtures
  - id: tools.toy_instances
    location: tools/corpus/make_toy_instances.m
    responsibility: definition, writing (Gurobi MPS, MOSEK JTASK), two-tool checks and provenance of toy instances
  - id: docs.llm_interface
    location: docs/llm-interface.md
    responsibility: the public-interface document for client authors and LLMs; also the crate-level documentation (examples are doctests; drift test in tests/standards.rs)
  - id: docs.llms_txt
    location: docs/llms.txt
    responsibility: llmstxt.org entry point for LLM tools
  - id: docs.test_corpus
    location: docs/test-corpus.md
    responsibility: description of every corpus fixture (Tier 3)
  - id: bench.load_solve
    location: benches/load_solve.rs
    responsibility: per-phase timing and dedicated-process memory measurement, per backend
